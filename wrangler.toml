# Static archive of finished events: public/<year>/<round>/ holds each event's page and frozen data.
# `/` redirects to the latest event (public/_redirects).
# To run the live board for a new event: wrangler deploy -c wrangler.live.toml
name = "fdf-ranking-board"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# no scheduled scraping for the archive; an explicit empty list removes the live cron
[triggers]
crons = []
